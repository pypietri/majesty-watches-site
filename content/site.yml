temoignages:
  - nom: Thomas D.
    etoiles: 5
    texte: "Je tiens à remercier chaleureusement Mika pour son professionnalisme et son accompagnement. Étant novice et compte tenu de tout ce que l’on peut entendre sur ce milieu, Mika a su me conseiller, me guider et m’accompagner à chaque étape, avec transparence et bienveillance. Sécurité, confiance et bonne humeur sont au rendez-vous."
  - nom: Jean Antoine G.
    etoiles: 5
    texte: "Très satisfait de mon achat, cette GMT-Master II est vraiment magnifique. Mika a été très professionnel et disponible du début à la fin, avec de bons conseils et un service sérieux. Je recommande sans hésiter."
  - nom: François A.
    etoiles: 5
    texte: "Un grand merci à Mickaël pour sa sympathie et son professionnalisme. Première transaction avec lui pour cette magnifique Rolex Daytona, et tout s’est parfaitement déroulé. Sérieux, disponible et de confiance, je recommande sans hésitation !"
  - nom: Nicolas A.
    etoiles: 5
    texte: "Très bonne expérience client. Montre achetée à distance qui correspond parfaitement au descriptif. Vous pouvez faire confiance. Merci à Mickaël pour son sérieux et son professionnalisme."
  - nom: Florian D.
    etoiles: 5
    texte: "Très satisfait de mon achat ! Mickaël a été très sympathique, toujours à l’écoute et très professionnel. Il a pris le temps de répondre à toutes mes questions. Un grand merci à lui, je recommande !"
  - nom: Stéphane B.
    etoiles: 5
    texte: "Merci Mickaël pour cette transaction en tout point conforme à mes attentes, pour la rapidité, le service et la gentillesse. Superbe Tudor Black Bay Burgundy ! Vendeur de confiance."

vendre:
  titre: Vendez votre montre en toute confiance
  intro: Recevez une estimation juste et précise grâce à l’expertise de notre équipe. Contactez-nous par WhatsApp, téléphone, Instagram ou e-mail en nous transmettant les informations suivantes.
  liste:
    - Référence de la montre
    - Année
    - État général
    - Prix souhaité
    - Photos claires de la montre
  conclusion: Nous vous remercions pour votre confiance et nous engageons à vous répondre dans les plus brefs délais.

recherche:
  titre: Recherche personnalisée
  intro: Vous recherchez un modèle qui n’est pas actuellement en stock ?
  texte: "Notre équipe met tout en œuvre pour vous le trouver grâce à notre réseau de partenaires de confiance, en France comme à l’international. Envoyez-nous la référence ou le modèle souhaité : nous revenons vers vous rapidement avec une proposition personnalisée."

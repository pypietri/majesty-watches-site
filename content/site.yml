temoignages:
  - nom: Antoine
    texte: Je tiens à exprimer ma grande satisfaction suite à mon expérience avec Mickaël lors de l’achat de ma montre. Dès le début, son professionnalisme et son expertise m’ont impressionné. Il a su répondre à toutes mes interrogations avec clarté et précision, ce qui a été extrêmement rassurant.
  - nom: Sacha
    texte: Un professionnel à l’écoute, qui a été le premier à chercher et trouver des solutions selon mes demandes. Il est de bon conseil, et surtout, le plus important, il est honnête. Vraiment très heureux d’avoir pu m’offrir ma première Rolex grâce à cet homme !
  - nom: Tony
    texte: Je recommande vivement Majesty Watches ! Mickaël se montre toujours disponible et réactif, et il offre d’excellents conseils. La montre que je souhaitais a été livrée en 15 jours, dans le respect du budget. Un immense merci !

vendre:
  titre: Vendez votre montre en toute confiance
  intro: Recevez une estimation juste et précise grâce à l’expertise de notre équipe. Contactez-nous par WhatsApp, téléphone, Instagram ou e-mail en nous transmettant les informations suivantes.
  liste:
    - Référence de la montre
    - Année
    - État général
    - Prix souhaité
    - Photos claires de la montre
  conclusion: Nous vous remercions pour votre confiance et nous engageons à vous répondre dans les plus brefs délais.

recherche:
  titre: Recherche personnalisée
  intro: Vous recherchez un modèle qui n’est pas actuellement en stock ?
  texte: "Notre équipe met tout en œuvre pour vous le trouver grâce à notre réseau de partenaires de confiance, en France comme à l’international. Envoyez-nous la référence ou le modèle souhaité : nous revenons vers vous rapidement avec une proposition personnalisée."

name: Récupérer les logos des maisons
on:
  workflow_dispatch:
  push:
    paths: ['tools/fetch-logos.mjs']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fetch-logos.mjs
      - name: Commit
        run: |
          git config user.name "majesty-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/marques
          git diff --cached --quiet || git commit -m "Logos des maisons"
          git push
